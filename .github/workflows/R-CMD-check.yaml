# Verifica el paquete en Windows, macOS y Linux en cada push y pull request.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Descarga ambos GeoPackages para ejecutar pruebas de resolución baja
      # y alta, que se omiten localmente si faltan datos (o durante CRAN).
      - name: Descargar capas y verificar archivos
        shell: bash
        run: |
          set -euo pipefail
          etiqueta=$(grep -o 'datos-v[0-9.]*' R/zzz.R | head -n 1)
          carpeta="$RUNNER_TEMP/geoecu"
          mkdir -p "$carpeta"
          for resolucion in baja alta; do
            archivo="$carpeta/geoecu_dpa_${resolucion}.gpkg"
            curl --fail --location --silent --show-error --retry 3 \
              -o "$archivo" \
              "https://github.com/${{ github.repository }}/releases/download/$etiqueta/geoecu_dpa_${resolucion}.gpkg"
            test -s "$archivo"
            # SQLite3/GeoPackage: cabecera esperada (no sustituye validación de contenido).
            test "$(head -c 15 "$archivo")" = "SQLite format 3"
          done
          echo "GEOECU_CARPETA=$carpeta" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
