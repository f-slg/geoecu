# Verifica el paquete en Windows, macOS y Linux en cada push y pull request.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Descarga la capa liviana para que se ejecuten las pruebas que necesitan
      # datos (en CRAN se omiten). La etiqueta se lee de R/zzz.R.
      - name: Descargar capas
        shell: bash
        run: |
          etiqueta=$(grep -o 'datos-v[0-9.]*' R/zzz.R | head -n 1)
          carpeta="$RUNNER_TEMP/geoecu"
          mkdir -p "$carpeta"
          curl -fsSL -o "$carpeta/geoecu_dpa_baja.gpkg" \
            "https://github.com/${{ github.repository }}/releases/download/$etiqueta/geoecu_dpa_baja.gpkg"
          echo "GEOECU_CARPETA=$carpeta" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
