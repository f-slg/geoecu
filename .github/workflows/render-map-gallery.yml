# Genera mapas de alta resolución para el README desde las capas oficiales.
# Renderiza y adjunta PNG para revisión, sin permisos para escribir en el repositorio.
name: Render detailed map gallery

on:
  pull_request:
    paths:
      - 'data-raw/03_figuras_readme.R'
      - 'man/figures/README-*.png'
      - '.github/workflows/render-map-gallery.yml'
      - 'DESCRIPTION'
  push:
    branches: [main]
    paths:
      - 'data-raw/03_figuras_readme.R'
      - 'man/figures/README-*.png'
      - '.github/workflows/render-map-gallery.yml'
  workflow_dispatch:

# Ningún job puede escribir en main ni en ramas de PR.
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::patchwork, any::scales, github::f-slg/pobecu
          needs: website

      - name: Render maps
        shell: Rscript {0}
        run: |
          source("data-raw/03_figuras_readme.R")
          figures <- file.path("man/figures", c(
            "README-provincias.png", "README-cantones.png",
            "README-parroquias.png", "README-niveles.png",
            "README-nacional.png", "README-loja.png",
            "README-densidad.png"
          ))
          stopifnot(all(file.exists(figures)),
                    all(file.info(figures)$size > 1000))

      # Conserva los PNG como artefactos para revisión manual.
      # Para publicarlos, se agregan al PR mediante git (nunca desde Actions).
      - name: Subir mapas generados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: geoecu-figuras-renderizadas
          path: man/figures/README-*.png
          if-no-files-found: error
          retention-days: 14
