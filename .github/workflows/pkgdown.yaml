# Construye pkgdown con permisos de solo lectura; publica desde un job aislado.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Descarga previa de las capas para que los ejemplos se ejecuten en el sitio.
      - name: Descargar capas
        run: |
          geoecu::read_provincias()
          geoecu::read_provincias(resolucion = "alta")
        shell: Rscript {0}

      - name: Comprobar ejemplos del README
        run: source("data-raw/06_validar_readme.R")
        shell: Rscript {0}

      - name: Construir el sitio
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Guardar sitio compilado para publicación
        uses: actions/upload-artifact@v4
        with:
          name: geoecu-pkgdown-site
          path: docs/
          if-no-files-found: error
          include-hidden-files: true

  publicar:
    name: Publicar GitHub Pages
    # Solo el código de main, nunca ramas de Pull Request, puede publicarse.
    needs: pkgdown
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar sitio compilado
        uses: actions/download-artifact@v4
        with:
          name: geoecu-pkgdown-site
          path: docs/

      - name: Publicar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
